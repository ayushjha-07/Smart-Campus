services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
      POSTGRES_DB: smartcampus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampus_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://smartcampus:smartcampus@postgres:5432/smartcampus
      - SECRET_KEY=smartcampus-dev-secret-key-change-in-production-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ALGORITHM=HS256
      - UPLOAD_DIR=uploads
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: smartcampus_postgres_data
